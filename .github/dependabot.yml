version: 2
updates:
  # 根 workspace（含 IntelligenceHub 和 intel-collector 两个 workspace 的依赖）
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    reviewers:
      - "unknowIfGuestInDream"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      next-ecosystem:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      typescript-eslint:
        patterns:
          - "typescript"
          - "@typescript-eslint/*"
          - "eslint"

  # IntelligenceHub workspace
  - package-ecosystem: "npm"
    directory: "/IntelligenceHub"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    reviewers:
      - "unknowIfGuestInDream"
    commit-message:
      prefix: "chore"
      include: "scope"

  # intel-collector workspace
  - package-ecosystem: "npm"
    directory: "/intel-collector"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    reviewers:
      - "unknowIfGuestInDream"
    commit-message:
      prefix: "chore"
      include: "scope"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    reviewers:
      - "unknowIfGuestInDream"
    commit-message:
      prefix: "ci"
      include: "scope"
