name: Collect & Deploy

on:
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pull existing daily history snapshots back from the deploy target so
      # the upcoming collect/build step keeps every previously published day
      # (otherwise each fresh CI checkout would start from an empty
      # `public/data/history/`, and the final `rsync --delete` would wipe all
      # but today's snapshot from the server — see issue about broken
      # `/history/<date>/` links). Best-effort: skip silently when secrets are
      # missing or the directory does not yet exist on the server.
      - name: Restore history snapshots from deploy target
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_TARGET: ${{ secrets.REMOTE_TARGET }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
        run: |
          set -euo pipefail
          mkdir -p IntelligenceHub/public/data/history
          if [ -z "${SSH_PRIVATE_KEY:-}" ] || [ -z "${REMOTE_HOST:-}" ] \
              || [ -z "${REMOTE_USER:-}" ] || [ -z "${REMOTE_TARGET:-}" ]; then
            echo "deploy secrets not configured — skipping history restore"
            exit 0
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Always remove the private key on exit, even if a later command fails.
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          port="${REMOTE_PORT:-22}"
          # Pin the server's host key from this run into known_hosts; combined
          # with StrictHostKeyChecking=yes this prevents silent acceptance of
          # a swapped key on subsequent ssh calls within this step.
          ssh-keyscan -p "$port" -H "$REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null \
            || echo "warning: ssh-keyscan failed for ${REMOTE_HOST}:${port}; relying on existing known_hosts"
          target="${REMOTE_TARGET%/}"
          # Trailing slash on source so contents (not the dir itself) are copied.
          # `|| true` keeps the workflow green when the remote dir is empty/missing
          # on the very first deploy.
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -p $port -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            "${REMOTE_USER}@${REMOTE_HOST}:${target}/data/history/" \
            IntelligenceHub/public/data/history/ || true

      # When the repo variable AI_PROVIDER=ollama is set, install and run
      # Ollama directly on the GitHub-hosted runner so the collector talks
      # to a *local* LLM at http://127.0.0.1:11434 instead of any remote API
      # — no API key, no third-party network call. Skipped entirely for the
      # default `heuristic` / `openai` providers, so existing runs are
      # unaffected.
      - name: Setup local Ollama
        # Only when the user wants Ollama AND has not pointed OLLAMA_BASE_URL
        # at a pre-existing remote / self-hosted instance.
        if: ${{ vars.AI_PROVIDER == 'ollama' && vars.OLLAMA_BASE_URL == '' }}
        env:
          # Default to a small, CPU-friendly model so the standard
          # GitHub-hosted runner can complete `ollama pull` and inference
          # within the job timeout. Override via repo variable OLLAMA_MODEL.
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'llama3.2:1b' }}
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          # Run the server detached; the job will be torn down when finished.
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          # Wait up to ~60s for the HTTP endpoint to be ready.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              echo "ollama is up after ${i} attempts"
              break
            fi
            sleep 2
          done
          if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            echo "ollama failed to start; recent log:" >&2
            tail -n 50 /tmp/ollama.log >&2 || true
            exit 1
          fi
          ollama pull "$OLLAMA_MODEL"

      - name: Collect & analyze news
        env:
          # AI provider selection. Set repo variable AI_PROVIDER to one of:
          #   heuristic (default, no deps, no network)
          #   ollama    (local LLM — automatically installed by the
          #              "Setup local Ollama" step above on this runner)
          #   openai    (uses OPENAI_API_KEY below)
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          # When OLLAMA_BASE_URL is unset the collector falls back to
          # http://127.0.0.1:11434/v1, which matches the in-runner daemon.
          OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}
          # Mirror the small default used by the setup step so the model
          # actually pulled above is the one the collector requests. When
          # OLLAMA_BASE_URL is set (remote/self-hosted Ollama), respect the
          # user's own OLLAMA_MODEL choice and don't inject a default.
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || (vars.AI_PROVIDER == 'ollama' && vars.OLLAMA_BASE_URL == '' && 'llama3.2:1b') || '' }}
          # Local Ollama on GitHub-hosted CPU runners is intentionally
          # conservative: analyze a small LLM sample and score the rest with
          # deterministic heuristics so the workflow cannot burn the full job
          # timeout when inference is slow. Repo variables can override both.
          COLLECT_ANALYZE_CONCURRENCY: ${{ vars.COLLECT_ANALYZE_CONCURRENCY || (vars.AI_PROVIDER == 'ollama' && '1') || '' }}
          COLLECT_MAX_LLM_ITEMS: ${{ vars.COLLECT_MAX_LLM_ITEMS || (vars.AI_PROVIDER == 'ollama' && '10') || '' }}
          NODE_ENV: production
        run: npm run collect -w intel-collector

      - name: Build static site
        run: npm run build -w IntelligenceHub

      - name: Upload collector output as artifact
        uses: actions/upload-artifact@v7
        with:
          name: news-json
          path: intel-collector/output/news.json
          retention-days: 14

      - name: Publish to server
        uses: easingthemes/ssh-deploy@v6.0.3
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: '-avzr --delete'
          SOURCE: 'IntelligenceHub/out/'
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: ${{ secrets.REMOTE_TARGET }}
